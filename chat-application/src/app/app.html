<div class="chat-container">
  
  <div class="sidebar-zone">
    <h3 style="padding: 16px 16px 8px 16px; margin: 0; color: #555; font-weight: 500; font-family: Roboto, sans-serif;">Active Chats</h3>
    
    <div (click)="selectUser('Ojas')" 
         [style.background-color]="selectedUser === 'Ojas' ? '#e8f0fe' : 'transparent'"
         style="display: flex; align-items: center; padding: 14px 16px; cursor: pointer; gap: 12px; transition: background 0.2s;">
      <mat-icon style="color: #555;">account_circle</mat-icon>
      <div style="display: flex; flex-direction: column; font-family: Roboto, sans-serif;">
        <span style="font-weight: 500; color: #212529; font-size: 14px;">Ojas</span>
        <span [ngClass]="{
                'status-online': userRoster[0].status === 'Online',
                'status-away': userRoster[0].status === 'Away',
                'status-offline': userRoster[0].status === 'Offline'
              }">{{ userRoster[0].status }}</span>
      </div>
    </div>

    <div (click)="selectUser('Vineet')" 
         [style.background-color]="selectedUser === 'Vineet' ? '#e8f0fe' : 'transparent'"
         style="display: flex; align-items: center; padding: 14px 16px; cursor: pointer; gap: 12px; transition: background 0.2s;">
      <mat-icon style="color: #555;">account_circle</mat-icon>
      <div style="display: flex; flex-direction: column; font-family: Roboto, sans-serif;">
        <span style="font-weight: 500; color: #212529; font-size: 14px;">Vineet</span>
        <span [ngClass]="{
                'status-online': userRoster[1].status === 'Online',
                'status-away': userRoster[1].status === 'Away',
                'status-offline': userRoster[1].status === 'Offline'
              }">{{ userRoster[1].status }}</span>
      </div>
    </div>
    
  </div>

  <div class="main-chat-zone">
    <div class="messages-container">
      <div class="bubble-stream">
        
        <ng-container *ngFor="let msg of messages">
          <div *ngIf="msg.chatWith === selectedUser"
               [ngClass]="{'msg-outgoing': msg.sender === 'Me', 'msg-incoming': msg.sender !== 'Me'}"
               class="msg-bubble">
            
            <strong *ngIf="msg.sender !== 'Me'" style="display: block; font-size: 11px; margin-bottom: 4px; color: #555;">
              {{ msg.sender }}
            </strong>
            
            <span *ngIf="msg.text">{{ msg.text }}</span>

            <div *ngIf="msg.fileData" style="margin-top: 4px; display: flex; flex-direction: column; gap: 6px;">
              <img *ngIf="msg.fileData.type.startsWith('image/')" 
                   [src]="msg.fileData.url" 
                   style="max-width: 200px; max-height: 150px; border-radius: 8px; border: 1px solid #ddd;" 
                   alt="Shared photo content file attachment inline preview row"/>
              
              <div style="display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,0.04); padding: 8px; border-radius: 6px;">
                <mat-icon style="color: #666;">insert_drive_file</mat-icon>
                <a [href]="msg.fileData.url" [download]="msg.fileData.name" target="_blank" style="font-weight: 500; text-decoration: underline; color: inherit; font-size: 13px; word-break: break-all; overflow-wrap: anywhere;">
                  {{ msg.fileData.name }}
                </a>
              </div>
            </div>

          </div>
        </ng-container>
        
      </div>
    </div>

    <div class="input-container">
      
      <input type="file" #fileInput (change)="onFileSelected($event)" style="display: none;">
      
      <button mat-icon-button color="accent" (click)="fileInput.click()" style="margin-right: -4px;" title="Attach shared data file media documentation">
        <mat-icon>attach_file</mat-icon>
      </button>

      <mat-form-field appearance="outline" class="input-field">
        <mat-label>Type a message...</mat-label>
        <input matInput [(ngModel)]="newMessage" (keyup.enter)="onSendMessage()" placeholder="Say something...">
      </mat-form-field>
      
      <button mat-fab color="primary" (click)="onSendMessage()">
        <mat-icon>send</mat-icon>
      </button>
    </div>

  </div>
</div>
