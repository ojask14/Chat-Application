<div class="chat-container">
  
  <div class="sidebar-zone">
    <h3 class="sidebar-title">Active Chats</h3>
    <mat-selection-list [multiple]="false">
      <mat-list-option value="user1">
        <mat-icon matListItemIcon>account_circle</mat-icon>
        <span matListItemTitle>Ojas</span>
        <span matListItemLine class="status-online">Online</span>
      </mat-list-option>
      <mat-list-option value="user2">
        <mat-icon matListItemIcon>account_circle</mat-icon>
        <span matListItemTitle>Vineet</span>
        <span matListItemLine class="status-away">Away</span>
      </mat-list-option>
    </mat-selection-list>
  </div>

  <div class="main-chat-zone">
    
    <div class="messages-container">
      <div class="bubble-stream">
        <mat-card class="msg-card msg-incoming">
          <mat-card-content>Hey there! Welcome to the chat system workspace.</mat-card-content>
        </mat-card>
        <mat-card class="msg-card msg-outgoing">
          <mat-card-content>Awesome, the UI setup looks perfect and responsive!</mat-card-content>
        </mat-card>
      </div>
    </div>

    <div class="input-container">
      <mat-form-field appearance="outline" class="input-field">
        <mat-label>Type a message...</mat-label>
        <input matInput placeholder="Say something...">
      </mat-form-field>
      <button mat-fab color="primary" aria-label="Send message">
        <mat-icon>send</mat-icon>
      </button>
    </div>

  </div>
</div>
